# Render Blueprint — free Web Service + free Postgres (SQLite replaced by PostgreSQL).
# https://render.com/docs/infrastructure-as-code
#
# Limitations: Free Postgres expires after 30 days unless upgraded (Render docs).
# Free Web Services spin down after idle (~15 min). Outbound SMTP ports are blocked on Free, so
# for email (leader-request alerts, new experiences, password resets) set these in the dashboard
# (Environment tab) rather than here, so a Blueprint sync never overwrites them:
#   MAIL_ENABLED=true  MAIL_PROVIDER=resend  RESEND_API_KEY=<secret>
#   MAIL_FROM=noreply@albertsonwardplan.com (domain verified in Resend)  MAIL_FROM_NAME (optional)

databases:
  - name: wardmission-db
    databaseName: wardmission
    user: wardmission
    region: oregon
    plan: free

services:
  - type: web
    name: albertsonwardplan
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wardmission-db
          property: connectionString
      - key: COOKIE_SECURE
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
